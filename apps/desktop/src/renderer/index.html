<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frameshell</title>
    <!-- Monaco injects styles at runtime; workers load as same-origin modules or blobs. The preview engine fetches proxies from frameshell-media:. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' frameshell-media:; media-src 'self' frameshell-media:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

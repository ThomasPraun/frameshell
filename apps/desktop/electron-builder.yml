# Release packaging (SPEC §4). Run through scripts/release/package.mjs: it sets version, signing and --publish never.
# Signing secrets and the release process: docs/release.md.
appId: dev.frameshell.app
productName: Frameshell
copyright: Copyright © Frameshell contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Workspace packages ship their build output only.
  - "!node_modules/@frameshell/*/{src,test,scripts,tsconfig.json,*.tsbuildinfo}"
  - "!node_modules/@frameshell/*/{src,test,scripts}/**"
# node-pty is N-API: one prebuilt binary serves Electron. No electron-rebuild (see scripts/prepare-native.mjs).
npmRebuild: false
# npm for plugin installs on machines without Node (#204), copied to resources/npm/ by the hook: as a dependency or
# extraResources, electron-builder drops the packages npm bundles inside itself.
afterPack: scripts/bundle-npm.mjs
# The bundled CLI and daemon run as `Frameshell --run-as-node` (ELECTRON_RUN_AS_NODE). Keep the RunAsNode fuse
# enabled: disabling it breaks `frameshell` in the terminal and daemon auto-start.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.video
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Open with Frameshell for videos (#184). Alternate rank: listed in Finder's Open with, never the default player.
  fileAssociations:
    - ext: [mp4, mov, m4v, mkv, webm]
      name: Video
      role: Viewer
      rank: Alternate
dmg:
  writeUpdateInfo: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: frameshell
  icon: build/icon.png
  category: AudioVideo
  synopsis: IDE for video
  description: Agent edits the project from the terminal, human corrects in the timeline.
  maintainer: Frameshell <92462502+ThomasPraun@users.noreply.github.com>
  vendor: Frameshell
  # Listed in the .desktop file's MimeType: offered in Open with, the default player stays the user's (#184). Not
  # fileAssociations: on Linux those also install a mime package that redefines these types with a document icon.
  mimeTypes: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm]
deb:
  # Same as electron-builder's defaults, except /usr/bin/frameshell: a script running the bundled CLI, not a link to
  # the app binary (#143).
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Open with for videos (#184): registry entries in HKCU, never the default handler. fileAssociations would need
  # perMachine and claim the extensions.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false

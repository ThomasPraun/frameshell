name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned ffmpeg for media tests (60-170 MB); re-downloaded only when the pins change.
      - uses: actions/cache@v4
        with:
          path: .cache/test-binaries
          key: test-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/core/src/binaries/manifest.ts') }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Stress flaky tests (temporary, #97)
        shell: bash
        run: for i in $(seq 1 30); do echo "round $i"; npx vitest run packages/cli/test/daemon-client.test.ts apps/desktop/test/terminals.test.ts || exit 1; done
      - run: pnpm build

  # Drives the built Electron app: real daemon, real login shell, real pty.
  e2e:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned ffmpeg for the preview e2e test's synthetic media and ingest; re-downloaded only when the pins change.
      - uses: actions/cache@v4
        with:
          path: .cache/test-binaries
          key: test-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/core/src/binaries/manifest.ts') }}
      - name: Smoke test (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7

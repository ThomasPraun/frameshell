name: Release

# Tag v<semver> -> build, smoke-test and attach installers to a DRAFT GitHub release (publish it by hand).
# Publishing that release -> stage the official plugins (plugins/*) on npm, each version npm lacks; a maintainer approves them.
# workflow_dispatch and pull requests touching packaging -> same build, smoke test and npm dry run, nothing published.
# workflow_dispatch with npm_publish_tag -> only retry the npm publish of that published release (no app build).
# Every pull request also runs the npm dry run in ci.yml.
# Secrets and the release checklist: docs/release.md.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_publish_tag:
        description: "Retry npm: publish the official plugins of this already published release (e.g. v0.4.0). Empty: build and dry run only."
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      # Any desktop or shared-package change can break the packaged app, so its e2e suite runs too.
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package ${{ matrix.os }}
    # Publishing the release only publishes npm packages: the installers are already on it.
    if: github.event_name != 'release' && !inputs.npm_publish_tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned ffmpeg for the preview e2e test's synthetic media and ingest; re-downloaded only when the pins change.
      - uses: actions/cache@v4
        with:
          path: .cache/test-binaries
          key: test-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/core/src/binaries/manifest.ts') }}
      - run: pnpm build
      - name: Package
        id: package
        run: node apps/desktop/scripts/release/package.mjs
        env:
          # Pull requests never see signing secrets: they always build unsigned.
          MACOS_CERTIFICATE_P12_BASE64: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8_BASE64: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          # Windows signs through SignPath (ADR 0051). Only whether the token exists reaches the build, never the token.
          SIGNPATH_API_TOKEN_SET: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID || '' }}
          SIGNPATH_PROJECT_SLUG: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && vars.SIGNPATH_PROJECT_SLUG || '' }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' && vars.SIGNPATH_SIGNING_POLICY_SLUG || '' }}
      # Windows with SignPath (ADR 0051): Package stopped at release/win-unpacked. Sign the app, build the installer
      # from it, sign the installer. Each signing request waits for a maintainer's approval on signpath.io.
      # Artifact configurations: .signpath/artifact-configurations/.
      - name: Read the app's product version
        id: product
        if: steps.package.outputs.signing == 'signpath'
        shell: pwsh
        # Both signing requests pin this value, so SignPath refuses files of another build.
        run: |
          $version = (Get-Item "${{ steps.package.outputs.executable }}").VersionInfo.ProductVersion
          "version=$version" >> $env:GITHUB_OUTPUT
          echo "ProductVersion: $version"
      - name: Upload the app for signing
        id: unsigned-app
        if: steps.package.outputs.signing == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-app
          path: apps/desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 1
      - name: Sign the app (SignPath)
        if: steps.package.outputs.signing == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Time for the maintainer to approve the request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/win-unpacked-signed
          parameters: |
            productVersion: ${{ toJSON(steps.product.outputs.version) }}
      - name: Swap in the signed app
        if: steps.package.outputs.signing == 'signpath'
        shell: bash
        working-directory: apps/desktop/release
        run: rm -rf win-unpacked && mv win-unpacked-signed win-unpacked
      - name: Build the installer from the signed app
        id: installer
        if: steps.package.outputs.signing == 'signpath'
        run: node apps/desktop/scripts/release/package.mjs --installer
      - name: Upload the installer for signing
        id: unsigned-installer
        if: steps.package.outputs.signing == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: ${{ steps.installer.outputs.installer }}
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: steps.package.outputs.signing == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/signed-installer
          parameters: |
            productVersion: ${{ toJSON(steps.product.outputs.version) }}
      - name: Swap in the signed installer and check both signatures
        if: steps.package.outputs.signing == 'signpath'
        shell: pwsh
        env:
          APP: ${{ steps.package.outputs.executable }}
          INSTALLER: ${{ steps.installer.outputs.installer }}
        run: |
          $signed = Join-Path "apps/desktop/release/signed-installer" (Split-Path $env:INSTALLER -Leaf)
          Move-Item -Force $signed $env:INSTALLER
          Remove-Item -Recurse -Force apps/desktop/release/signed-installer
          foreach ($file in @($env:APP, $env:INSTALLER)) {
            $signature = Get-AuthenticodeSignature $file
            echo "$file : $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.StatusMessage)" }
          }
      # The packaged app, not the dev build: bundled CLI and daemon, asar, native modules.
      - name: Smoke test packaged app (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @frameshell/desktop exec playwright test
        env:
          FRAMESHELL_E2E_APP: ${{ steps.package.outputs.executable }}
      # The .deb's /usr/bin/frameshell must run the bundled CLI (not the app), and go away with the package.
      - name: Install the .deb and run its frameshell command
        if: runner.os == 'Linux'
        run: |
          deb=$(ls apps/desktop/release/*.deb)
          # The runner image's package index can be stale: refresh it so the .deb's dependencies resolve.
          sudo apt-get update
          sudo apt-get install -y "$PWD/$deb"
          # Debian writes a semver prerelease dash as `~` (0.0.0-ci.1 -> 0.0.0~ci.1).
          version=$(frameshell --version) && echo "frameshell --version: $version"
          test "$version" = "$(dpkg-deb -f "$deb" Version | tr '~' '-')"
          frameshell doctor --json > doctor.json || true
          jq -e '.command.path == "/usr/bin/frameshell" and .command.same and .command.cli.app' doctor.json
          sudo apt-get remove -y "$(dpkg-deb -f "$deb" Package)"
          test ! -e /usr/bin/frameshell
      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: pnpm --filter @frameshell/desktop exec playwright test
        env:
          FRAMESHELL_E2E_APP: ${{ steps.package.outputs.executable }}
      - name: Check notarization
        if: runner.os == 'macOS' && steps.package.outputs.signing == 'notarized'
        run: |
          for app in apps/desktop/release/mac*/Frameshell.app; do
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: frameshell-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            # Update metadata for electron-updater (#193): macOS installs the zips, Linux the AppImage. Windows only
            # gets a banner, so its latest.yml stays out.
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-release-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7

  publish:
    name: draft release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The app's manifest points at the ffmpeg mirror as a fallback: never release while it is missing or stale.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b packages/core
      - name: Check binary mirror
        run: node packages/core/scripts/binaries-mirror.mjs verify ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: frameshell-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Draft: a maintainer reviews the assets and publishes. ffmpeg lives in its own mirror release, with its source (SPEC §9).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          # One download per OS on top (#740); --generate-notes appends the changes after it.
          node apps/desktop/scripts/release/downloads.mjs dist "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --verify-tag \
            --title "Frameshell ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes

  # Official plugins on npm (SPEC §8.3). Every run packs them and runs `npm publish --dry-run`; only a
  # maintainer publishing a reviewed v* release publishes, so nothing reaches npm from a tag alone.
  npm-plugins:
    name: npm plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm authenticates this workflow by its OIDC identity (no token)
      # and signs each package's provenance with it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A retry publishes the release's own sources, never main's.
          ref: ${{ inputs.npm_publish_tag }}
      - name: Check the release to retry
        if: inputs.npm_publish_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.npm_publish_tag }}
        run: |
          [[ "$TAG" == v* ]] || { echo "::error::npm_publish_tag must be a v* tag, got $TAG"; exit 1; }
          test "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false \
            || { echo "::error::$TAG is not a published release: publish it first"; exit 1; }
          # The tag's packages, published by this workflow's script (a fix to publishing applies to a retry).
          git fetch --depth 1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/plugins-npm.mjs" > scripts/plugins-npm.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b plugins/whisper-cpp plugins/hyperframes plugins/remotion plugins/blender plugins/openai-speech plugins/openai-transcription
      - name: Pack and dry run
        run: node scripts/plugins-npm.mjs dry-run
      - name: Publish to npm
        if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || inputs.npm_publish_tag
        run: node scripts/plugins-npm.mjs publish

<!doctype html>
<!-- PROTOTYPE, throwaway. 8 s 2560x1440 title card, transparent background (ticket #3). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <meta data-composition-id="title-card" data-width="2560" data-height="1440" />
    <title>Title card</title>
    <!-- Copied from node_modules by render.mjs: render stays offline and pinned. -->
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* No page background on purpose: the producer forces it transparent anyway. */
      html, body { width: 2560px; height: 1440px; overflow: hidden; }
      #stage { position: relative; width: 2560px; height: 1440px; overflow: hidden; }
      .clip { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; }
      /* Semi-transparent panel: checks partial alpha survives the pipeline. */
      #panel {
        position: absolute; left: 160px; top: 880px; width: 1500px; height: 360px;
        border-radius: 32px; background: rgba(12, 18, 40, 0.6);
        transform: translateX(-1800px);
      }
      #bar {
        position: absolute; left: 160px; top: 880px; width: 24px; height: 360px;
        border-radius: 12px; background: #ff4d6d; transform: scaleY(0); transform-origin: top;
      }
      #title {
        position: absolute; left: 240px; top: 920px;
        font: 800 150px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
        opacity: 0; transform: translateY(40px);
      }
      #subtitle {
        position: absolute; left: 244px; top: 1100px;
        font: 500 64px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #ffd166;
        opacity: 0;
      }
      #dot {
        position: absolute; left: 2200px; top: 160px; width: 160px; height: 160px;
        border-radius: 50%; background: #06d6a0;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="card" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="panel"></div>
        <div id="bar"></div>
        <h1 id="title">Frameshell</h1>
        <p id="subtitle">HyperFrames alpha spike</p>
        <div id="dot"></div>
      </div>
    </div>
    <script>
      var tl = gsap.timeline({ paused: true });
      tl.to("#panel", { x: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.to("#bar", { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.8);
      tl.to("#title", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.0);
      tl.to("#subtitle", { opacity: 1, duration: 0.6 }, 1.5);
      tl.to("#dot", { rotation: 360, x: -300, y: 200, duration: 6, ease: "none" }, 0);
      tl.to(["#panel", "#bar", "#title", "#subtitle"], { opacity: 0, duration: 0.6 }, 7.2);
      tl.set({}, {}, 8); // Pin duration to exactly 8 s.
      window.__timelines = window.__timelines || {};
      window.__timelines["title-card"] = tl;
    </script>
  </body>
</html>

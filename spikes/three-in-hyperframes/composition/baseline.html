<!doctype html>
<html>
  <head>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
      #stage { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
      #box { position: absolute; left: 400px; top: 300px; width: 400px; height: 400px; background: #1d2330; border-radius: 40px; }
    </style>
    <script src="frameshell-motion.js"></script>
    <script src="spike-config.js"></script>
  </head>
  <body>
    <div id="stage" data-composition-id="three" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <div class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0"><div id="box"></div></div>
    </div>
    <script>
      // Control for the render-time measurement: the same stage and runtime at the same size, with a 2D box instead of the 3D scene.
      var M = window.FrameshellMotion;
      var box = document.getElementById("box");
      M.bind("three", function (t) { M.write(box, { x: 300 * M.ease("enter", t / window.SPIKE.duration), rotate: 20 * t }); });
    </script>
  </body>
</html>

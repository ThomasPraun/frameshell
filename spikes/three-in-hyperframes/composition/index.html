<!doctype html>
<html>
  <head>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: transparent; }
      #stage { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
      canvas { display: block; width: {{W}}px; height: {{H}}px; }
    </style>
    <script src="frameshell-motion.js"></script>
    <script src="frameshell-three.js"></script>
    <script src="spike-config.js"></script>
  </head>
  <body>
    <div id="stage" data-composition-id="three" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <div class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0"></div>
    </div>
    <script>
      // Product shot: PMREM studio environment, three lights, soft shadows, clearcoat, MSAA, transparent clear.
      // paint(t) is a pure function of t: every pose is computed from t, nothing reads a clock.
      (function () {
        var M = window.FrameshellMotion;
        var S = window.SPIKE;
        var W = S.width, H = S.height, DUR = S.duration;
        var diag = (window.__spike = { paintMs: [], loads: {}, pmremMs: 0, gl: {} });

        var canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        document.querySelector(".clip").appendChild(canvas);
        var renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: S.msaa,
          alpha: true,
          premultipliedAlpha: true,
          preserveDrawingBuffer: !!S.preserveDrawingBuffer,
          powerPreference: "high-performance",
        });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H, false);
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.NeutralToneMapping;
        renderer.shadowMap.enabled = S.shadows !== "off";
        renderer.shadowMap.type = S.shadows === "pcf" ? THREE.PCFShadowMap : THREE.VSMShadowMap;
        var gl = renderer.getContext();
        var dbg = gl.getExtension("WEBGL_debug_renderer_info");
        diag.gl = {
          version: gl.getParameter(gl.VERSION),
          renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "n/a",
          maxSamples: gl.getParameter(gl.MAX_SAMPLES),
          samples: gl.getParameter(gl.SAMPLES),
          maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
          contextAttributes: gl.getContextAttributes(),
        };

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 50);

        // PMREM studio environment, generated once (counted separately from per-frame cost).
        var p0 = performance.now();
        var pmrem = new THREE.PMREMGenerator(renderer);
        var envRT = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04, 0.1, 100, { size: S.pmremSize });
        scene.environment = envRT.texture;
        scene.environmentIntensity = 0.8;
        pmrem.dispose();
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
        diag.pmremMs = performance.now() - p0;

        // Three lights: key (shadow), rim, fill.
        var key = new THREE.DirectionalLight(0xfff1e0, 2.4);
        key.position.set(3, 5, 4);
        key.castShadow = S.shadows !== "off";
        key.shadow.mapSize.set(S.shadowMap, S.shadowMap);
        key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
        key.shadow.camera.near = 0.5; key.shadow.camera.far = 14;
        key.shadow.radius = S.shadowRadius || 24; key.shadow.blurSamples = S.shadowBlurSamples || 25; key.shadow.bias = -0.0004;
        var rim = new THREE.SpotLight(0x9bbcff, 90, 0, 0.5, 0.6, 2);
        rim.position.set(-3.5, 3, -3);
        rim.target.position.set(0, 0, 0);
        var fill = new THREE.HemisphereLight(0xdfe8ff, 0x221a14, 0.5);
        scene.add(key, key.target, rim, rim.target, fill);

        // Subject: clearcoat body, label plate with a loaded texture, and a loaded GLB crate.
        var subject = new THREE.Group();
        var body = new THREE.Mesh(
          new THREE.RoundedBoxGeometry(1, 1.6, 0.6, 6, 0.08),
          new THREE.MeshPhysicalMaterial({ color: 0x1d2330, metalness: 0.1, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.08 }),
        );
        body.castShadow = true;
        body.receiveShadow = true;
        var label = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }));
        label.position.set(0, 0.1, 0.305);
        subject.add(body, label);
        subject.position.set(-0.4, 0, 0);
        scene.add(subject);

        var crate = new THREE.Group();
        crate.position.set(1.3, -0.4, 0.5);
        scene.add(crate);

        var ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.4 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.8;
        ground.receiveShadow = true;
        scene.add(ground);

        // Translucent backdrop panel: partial alpha in the output.
        var panel = new THREE.Mesh(
          new THREE.PlaneGeometry(4.2, 2.4),
          new THREE.MeshStandardMaterial({ color: 0xdde6ff, roughness: 0.6, transparent: true, opacity: 0.5 }),
        );
        panel.position.set(0, 0.3, -1.4);
        panel.receiveShadow = true;
        scene.add(panel);

        var lastT = 0;
        var sync = new Uint8Array(4);
        function paint(t) {
          lastT = t;
          var u = Math.min(1, Math.max(0, t / DUR));
          var e = M.ease("enter", u);
          subject.rotation.y = -0.6 + 1.2 * e;
          crate.rotation.y = 0.4 + 2 * e;
          crate.rotation.x = 0.25;
          var a = -0.3 + 0.6 * u;
          camera.position.set(6.5 * Math.sin(a), 1.2, 6.5 * Math.cos(a));
          camera.lookAt(0, 0.1, 0);
          var t0 = performance.now();
          renderer.render(scene, camera);
          // gl.finish() does not wait for the GPU process in Chrome; a 1x1 readback does.
          if (S.finish) gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, sync);
          diag.paintMs.push(performance.now() - t0);
        }

        // Loads start before bind so the HyperFrames readiness gate (DefaultLoadingManager) sees them in "sync" mode.
        function startLoads(hold) {
          var l0 = performance.now();
          var tex = new THREE.TextureLoader().loadAsync("checker.png").then(function (t) {
            t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = 4;
            label.material.map = t;
            label.material.needsUpdate = true;
            diag.loads.texture = performance.now() - l0;
          });
          var model = new THREE.GLTFLoader().loadAsync("product.glb").then(function (g) {
            g.scene.scale.setScalar(0.55);
            g.scene.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            crate.add(g.scene);
            diag.loads.glb = performance.now() - l0;
          });
          return Promise.all([tex, model]).then(function () {
            if (hold) THREE.DefaultLoadingManager.itemEnd("hold");
            diag.loads.both = performance.now() - l0;
            diag.loadsDone = true;
            paint(lastT); // the live preview has no further seek to pick the finished loads up
          });
        }
        // Loads outside the default LoadingManager: fetch + createImageBitmap + GLTFLoader.parse. The readiness gate cannot see the fetches.
        function startFetchLoads() {
          var tex = fetch("checker.png").then(function (r) { return r.blob(); }).then(function (b) { return createImageBitmap(b, { imageOrientation: "flipY" }); }).then(function (bmp) {
            var t = new THREE.CanvasTexture(bmp);
            t.colorSpace = THREE.SRGBColorSpace;
            label.material.map = t;
            label.material.needsUpdate = true;
          });
          var model = fetch("product.glb").then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
            return new Promise(function (resolve, reject) { new THREE.GLTFLoader().parse(buf, "", resolve, reject); });
          }).then(function (g) {
            g.scene.scale.setScalar(0.55);
            g.scene.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            crate.add(g.scene);
          });
          Promise.all([tex, model]).then(function () { diag.loadsDone = true; paint(lastT); });
        }
        // HyperFrames' three adapter reads DefaultLoadingManager.itemsLoaded / itemsTotal as numbers; record what this build exposes.
        diag.manager = { itemsLoaded: typeof THREE.DefaultLoadingManager.itemsLoaded, itemsTotal: typeof THREE.DefaultLoadingManager.itemsTotal };
        diag.loadMode = S.loadMode;
        // Hook of the HyperFrames runtime: it holds __renderReady until every promise in window.__hf.buildReady settles.
        if (S.loadMode === "buildready" || S.loadMode === "buildready-sync") {
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady.three =
            S.loadMode === "buildready-sync"
              ? Promise.resolve().then(function () { return startLoads(); })
              : new Promise(function (r) { setTimeout(r, S.lateMs || 5000); }).then(function () { return startLoads(); });
        }
        if (S.loadMode === "fetch") startFetchLoads();
        else if (S.loadMode === "sync") startLoads();
        // The loads start late, but the script holds the default manager from the start (itemStart) until they finish: a gated slow load.
        else if (S.loadMode === "slow-gated") {
          THREE.DefaultLoadingManager.itemStart("hold");
          setTimeout(function () { startLoads(true); }, S.lateMs || 5000);
        }
        else if (S.loadMode === "late") setTimeout(startLoads, S.lateMs || 400);

        M.bind("three", paint);
      })();
    </script>
  </body>
</html>
